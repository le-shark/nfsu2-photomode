[PhotoMode]
Hotkey = END                  ; Key that opens/closes photo mode (END, HOME, P, 0x23, ...)
GamepadCombo = 1              ; L3 + R3 (click both sticks) on an XInput pad opens it; B closes it
PauseMenu = 1                 ; 1 = a "Photo Mode" icon in the game's pause menu (after Options)
Drive = 1                     ; 1 = a Drive row and key: drive the car with photo mode open (the camera stays yours)
DriveKey = V                  ; starts and stops driving (Esc also stops it; pad: Back)

[Camera]
MoveSpeed = 6.0               ; metres per second (Shift x4, Ctrl x0.25)
MouseSensitivity = 0.12       ; degrees per mouse count
StickLookSpeed = 110          ; degrees per second at full right-stick deflection
RollSpeed = 45                ; degrees per second
InvertY = 0
MaxDistance = 30              ; how far the camera may go from the car (metres)
FovCalibration = 0            ; 0 = default. Multiplier between the game FOV value and vertical FOV

[Capture]
OutputDir =                   ; empty = <game>\screenshots
AntiAliasing = 1              ; sub-pixel jitter between samples
DefaultQuality = 1            ; 0 Draft (32 samples), 1 High (128), 2 Ultra (256)

[Preview]
Enable = 1                    ; when the camera and settings are still, the view converges to the photo (DOF, AA)
Delay = 0.15                  ; seconds of stillness before the preview starts

[Menu]
; The photo mode menu is the game's own options screen, reshaped into a full-height bar on the left.
; Units are FE canvas pixels: the screen is 480 high (and 480 x aspect wide).
Width = 356                   ; bar width
Margin = 16                   ; gap between the bar and the screen edges
ValueWidth = 110              ; width of the value column between the < > arrows
BackingAlpha = 140            ; panel background opacity 0..255

[Debug]
Verbose = 0                   ; 1 = extra diagnostics in the log (car list, menu input, state after exit)
Tools = 1                     ; developer keys (F12 saves a debug screenshot); the player release ships 0
