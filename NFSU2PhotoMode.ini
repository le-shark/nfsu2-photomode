[PhotoMode]
Hotkey = TAB                  ; Key that opens/closes photo mode (TAB, F7, P, 0x09, ...)
GamepadCombo = 1              ; L3 + R3 (click both sticks) on an XInput pad opens it; B closes it

[Camera]
MoveSpeed = 6.0               ; metres per second (Shift x4, Ctrl x0.25)
MouseSensitivity = 0.12       ; degrees per mouse count
StickLookSpeed = 110          ; degrees per second at full right-stick deflection
RollSpeed = 45                ; degrees per second
InvertY = 0
MaxDistance = 30              ; how far the camera may go from the car (metres)
FovCalibration = 0            ; 0 = default. Multiplier between the game FOV value and vertical FOV

[Capture]
OutputDir =                   ; empty = <game>\screenshots
AntiAliasing = 1              ; sub-pixel jitter between samples
DefaultQuality = 1            ; 0 Draft (32 samples), 1 High (128), 2 Ultra (256)

[UI]
; Positions are on the game's 640x480 FE canvas, origin at the centre.
X = -300
Y = -170
LineHeight = 17
ValueOffset = 170
HelpY = 205
ColorNormal = FFB4C8DC        ; AARRGGBB
ColorSelected = FFFFC800
ColorTitle = FFFFFFFF
ColorHelp = FF8CA0B4

[Debug]
Verbose = 0
