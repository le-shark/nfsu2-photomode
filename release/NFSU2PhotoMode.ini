[PhotoMode]
Hotkey = END                  ; hotkey to enter/exit photo mode
PauseMenu = 1                 ; whether the icon appears in pause menu
DriveKey = V                  ; hotkey to enable driving in photo mode

[Camera]
MoveSpeed = 6.0               ; metres per second (shift boosts by x4, ctrl slows down for x0.25)
MouseSensitivity = 0.12       ; degrees per mouse count
StickLookSpeed = 110          ; degrees per second at full right-stick deflection
RollSpeed = 45                ; degrees per second
InvertY = 0
MaxDistance = 30              ; how far the camera may go from the car (metres)

[Capture]
OutputDir =                   ; empty = <game>\screenshots

[Menu]
; Units are frontend canvas pixels: the screen is 480 high (and 480 x aspect wide).
Width = 356                   ; bar width

[Debug]
Verbose = 0                   ; 1 = more logs (please leave this on if you want to send logs)
